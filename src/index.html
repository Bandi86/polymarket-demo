<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitcoin Bot Trading Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="./frontend.tsx" async></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #12121a;
        --bg-card: #161622;
        --border: #2a2a3a;
        --text-primary: #f0f0f5;
        --text-secondary: #8888a0;
        --text-muted: #555566;
        --accent: #8b5cf6;
        --btc: #f7931a;
        --green: #22c55e;
        --green-dim: rgba(34, 197, 94, 0.15);
        --red: #ef4444;
        --red-dim: rgba(239, 68, 68, 0.15);
      }
      
      body {
        font-family: 'Inter', -apple-system, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        line-height: 1.5;
        font-size: 14px;
      }

      .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }

      /* Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        padding: 1rem 1.5rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .logo { display: flex; align-items: center; gap: 0.75rem; }
      .logo-icon {
        width: 40px; height: 40px;
        background: linear-gradient(135deg, var(--btc), #ffb84d);
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.25rem; font-weight: 700; color: #000;
      }
      .logo h1 { font-size: 1.25rem; font-weight: 700; color: var(--btc); }
      .logo p { font-size: 0.7rem; color: var(--text-secondary); }

      .header-stats { display: flex; gap: 2rem; }
      .stat-box { text-align: right; }
      .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
      .stat-value { font-size: 1.5rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
      .stat-value.positive { color: var(--green); }
      .stat-value.negative { color: var(--red); }

      .header-actions { display: flex; gap: 0.5rem; }
      .btn {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .btn-primary { background: var(--btc); color: #000; }
      .btn-primary:hover { background: #ffb84d; }
      .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
      .btn-secondary:hover { background: var(--border); }

      /* Stats Row */
      .stats-row {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem;
        position: relative;
        overflow: hidden;
      }
      .stat-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--btc), var(--accent));
        opacity: 0.5;
      }
      .stat-card-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.3rem; }
      .stat-card-value { font-size: 1.25rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
      .stat-card-sub { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.15rem; }
      .stat-card-change { font-size: 0.65rem; font-weight: 600; margin-left: 0.3rem; }
      .stat-card-change.up { color: var(--green); }
      .stat-card-change.down { color: var(--red); }
      .api-status { display: inline-flex; align-items: center; gap: 0.25rem; }
      .api-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
      .api-dot.stale { background: var(--red); }
      .fee-badge { font-size: 0.55rem; background: rgba(139, 92, 246, 0.2); color: var(--accent); padding: 0.15rem 0.35rem; border-radius: 4px; margin-left: auto; }

      /* Main Grid */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 1rem;
      }

      /* Market Card */
      .market-card {
        background: var(--bg-card);
        border: 2px solid var(--btc);
        border-radius: 14px;
        padding: 1.25rem;
      }
      .market-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
      .market-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.15rem; display: flex; align-items: center; gap: 0.5rem; }
      .market-question-mark { font-size: 0.7rem; background: var(--accent); color: #fff; padding: 0.15rem 0.4rem; border-radius: 4px; }
      .market-desc { font-size: 0.8rem; color: var(--text-secondary); }
      .market-meta { display: flex; gap: 1rem; font-size: 0.65rem; color: var(--text-muted); margin-top: 0.3rem; }
      .market-meta-item { display: flex; align-items: center; gap: 0.25rem; }
      .timer-value { font-size: 1.75rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
      .timer-value.warning { color: var(--red); animation: pulse 1s infinite; }
      .timer-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; text-align: right; }
      .progress-bar { height: 3px; background: var(--bg-primary); border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
      .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--btc)); border-radius: 2px; transition: width 0.5s; }

      .new-chart-container { margin-bottom: 1rem; }
      .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
      .chart-title { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
      .chart-legend { display: flex; gap: 0.75rem; }
      .legend-item { font-size: 0.65rem; font-weight: 600; padding: 0.15rem 0.4rem; border-radius: 4px; }
      .legend-item.yes { background: var(--green-dim); color: var(--green); }
      .legend-item.no { background: var(--red-dim); color: var(--red); }
      
      .price-chart { display: flex; height: 120px; background: var(--bg-primary); border-radius: 8px; overflow: hidden; position: relative; }
      .chart-y-axis { display: flex; flex-direction: column; justify-content: space-between; padding: 0.5rem 0.25rem; font-size: 0.55rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; text-align: right; min-width: 35px; }
      .chart-canvas { flex: 1; position: relative; }
      .chart-grid-lines { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
      .grid-line { position: absolute; left: 0; right: 0; height: 1px; background: var(--border); opacity: 0.3; }
      .price-line-svg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
      
      .probability-bar-container { margin-top: 0.75rem; }
      .probability-label { font-size: 0.65rem; color: var(--text-secondary); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em; }
      .probability-bar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; }
      .prob-yes { background: linear-gradient(135deg, var(--green), #16a34a); display: flex; align-items: center; justify-content: center; transition: width 0.5s; }
      .prob-yes span { font-size: 0.7rem; font-weight: 700; color: #000; }
      .prob-no { background: linear-gradient(135deg, var(--red), #dc2626); display: flex; align-items: center; justify-content: center; transition: width 0.5s; }
      .prob-no span { font-size: 0.7rem; font-weight: 700; color: #fff; }

      .chart-area {
        height: 80px;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        margin-bottom: 1rem;
        padding: 0.75rem;
        background: var(--bg-primary);
        border-radius: 8px;
        position: relative;
      }
      .chart-grid {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 20px 20px;
        opacity: 0.3;
        pointer-events: none;
      }
      .chart-midline {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--text-muted);
        top: 50%;
        opacity: 0.3;
      }
      .chart-bar { flex: 1; background: var(--accent); border-radius: 1px 1px 0 0; min-height: 2px; transition: height 0.3s; }
      .chart-bar.up { background: linear-gradient(to top, var(--green), #4ade80); }
      .chart-bar.down { background: linear-gradient(to top, var(--red), #f87171); }

      .odds-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
      .odd-card { padding: 1rem; border-radius: 10px; text-align: center; position: relative; overflow: hidden; }
      .odd-card.yes { background: var(--green-dim); border: 1px solid rgba(34, 197, 94, 0.3); }
      .odd-card.no { background: var(--red-dim); border: 1px solid rgba(239, 68, 68, 0.3); }
      .odd-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
      .odd-card.yes::after { background: var(--green); }
      .odd-card.no::after { background: var(--red); }
      .odd-label { font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem; text-transform: uppercase; }
      .odd-card.yes .odd-label { color: var(--green); }
      .odd-card.no .odd-label { color: var(--red); }
      .odd-value { font-size: 2.5rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
      .odd-card.yes .odd-value { color: var(--green); }
      .odd-card.no .odd-value { color: var(--red); }
      .odd-payout { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.25rem; }
      .odd-fee { font-size: 0.6rem; color: var(--accent); margin-top: 0.15rem; opacity: 0.8; }

      .trade-controls { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
      .amount-group { display: flex; align-items: center; gap: 0.5rem; }
      .amount-group label { font-size: 0.8rem; color: var(--text-secondary); }
      .amount-input {
        width: 70px;
        padding: 0.5rem;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-primary);
        font-size: 0.9rem;
        font-weight: 600;
        text-align: center;
        font-family: 'JetBrains Mono', monospace;
      }
      .amount-input:focus { outline: none; border-color: var(--accent); }
      .quick-btns { display: flex; gap: 0.3rem; }
      .quick-btn {
        padding: 0.4rem 0.65rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 5px;
        color: var(--text-secondary);
        font-size: 0.7rem;
        cursor: pointer;
      }
      .quick-btn:hover { background: var(--border); color: var(--text-primary); }
      .quick-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

      .tab-btn {
        padding: 0.35rem 0.75rem;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-secondary);
        font-size: 0.7rem;
        cursor: pointer;
        transition: all 0.2s;
      }
      .tab-btn:hover { background: var(--border); color: var(--text-primary); }
      .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

      .bet-btns { display: flex; gap: 0.5rem; flex: 1; }
      .bet-btn {
        flex: 1;
        padding: 0.75rem;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .bet-btn.yes { background: var(--green); color: #000; }
      .bet-btn.yes:hover { background: #16a34a; }
      .bet-btn.no { background: var(--red); color: #fff; }
      .bet-btn.no:hover { background: #dc2626; }
      .bet-btn:disabled { opacity: 0.3; cursor: not-allowed; }

      /* Card */
      .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; }
      .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
      .card-title { font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }

      /* Positions */
      .pos-list { max-height: 150px; overflow-y: auto; }
      .pos-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 0.6rem; background: var(--bg-primary); border-radius: 8px; margin-bottom: 0.4rem;
        border-left: 3px solid transparent;
      }
      .pos-item.yes { border-left-color: var(--green); }
      .pos-item.no { border-left-color: var(--red); }
      .pos-left { display: flex; align-items: center; gap: 0.5rem; }
      .pos-outcome { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
      .pos-outcome.yes { background: var(--green-dim); color: var(--green); }
      .pos-outcome.no { background: var(--red-dim); color: var(--red); }
      .pos-details { font-size: 0.7rem; color: var(--text-secondary); }
      .pos-fee { font-size: 0.6rem; color: var(--accent); margin-left: 0.3rem; }
      .pos-right { display: flex; align-items: center; gap: 0.75rem; }
      .pos-pnl { font-size: 0.8rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
      .pos-pnl.positive { color: var(--green); }
      .pos-pnl.negative { color: var(--red); }
      .close-btn {
        padding: 0.25rem 0.5rem; background: transparent; border: 1px solid var(--red); color: var(--red);
        border-radius: 4px; font-size: 0.65rem; font-weight: 600; cursor: pointer;
      }
      .close-btn:hover { background: var(--red); color: #fff; }

      /* History */
      .hist-list { max-height: 120px; overflow-y: auto; }
      .hist-item { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.6rem; background: var(--bg-primary); border-radius: 6px; margin-bottom: 0.3rem; font-size: 0.75rem; }
      .hist-outcome { font-weight: 600; }
      .hist-outcome.yes { color: var(--green); }
      .hist-outcome.no { color: var(--red); }
      .hist-odds { color: var(--text-muted); font-size: 0.7rem; margin-left: 0.5rem; }
      .hist-pnl { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
      .hist-pnl.positive { color: var(--green); }
      .hist-pnl.negative { color: var(--red); }

      /* Sidebar */
      .sidebar { display: flex; flex-direction: column; gap: 0.75rem; }

      /* Bots */
      .bot-list { display: flex; flex-direction: column; gap: 0.5rem; }
      .bot-item {
        padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px;
      }
      .bot-item.active { border-color: var(--accent); }
      .bot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
      .bot-name { font-weight: 600; font-size: 0.85rem; }
      
      .bot-btn {
        padding: 0.35rem 0.75rem;
        border: none;
        border-radius: 6px;
        font-size: 0.7rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
      }
      .bot-btn.start { background: var(--green); color: #000; }
      .bot-btn.start:hover { background: #16a34a; }
      .bot-btn.stop { background: var(--red); color: #fff; }
      .bot-btn.stop:hover { background: #dc2626; }

      .bot-config { display: flex; gap: 0.4rem; margin-bottom: 0.4rem; }
      .bot-config input {
        flex: 1; padding: 0.3rem 0.5rem; background: var(--bg-secondary); border: 1px solid var(--border);
        border-radius: 4px; color: var(--text-primary); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace;
      }
      .bot-config input:focus { outline: none; border-color: var(--accent); }
      .bot-labels { display: flex; gap: 0.4rem; font-size: 0.6rem; color: var(--text-muted); margin-bottom: 0.3rem; }
      
      .bot-stats { display: flex; justify-content: space-between; font-size: 0.65rem; }
      .bot-stat { color: var(--text-secondary); }
      .bot-stat.positive { color: var(--green); }
      .bot-stat.negative { color: var(--red); }

      /* Feed */
      .feed { max-height: 180px; overflow-y: auto; }
      .feed-item { display: flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0; border-bottom: 1px solid var(--border); font-size: 0.75rem; }
      .feed-item:last-child { border-bottom: none; }
      .feed-time { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; }
      .feed-item.trade .feed-msg { color: var(--green); }
      .feed-item.manual_trade .feed-msg { color: var(--accent); }
      .feed-item.bot_started .feed-msg { color: var(--green); }
      .feed-item.bot_stopped .feed-msg { color: var(--red); }
      .feed-item.market_settled .feed-msg { color: var(--btc); }

      /* Summary */
      .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .summary-item { background: var(--bg-primary); padding: 0.5rem; border-radius: 6px; }
      .summary-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }
      .summary-value { font-size: 1rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
      .summary-value.green { color: var(--green); }
      .summary-value.red { color: var(--red); }

      /* Footer */
      .footer {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        font-size: 0.7rem;
        color: var(--text-secondary);
      }
      .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 0.4rem; }

      .empty { text-align: center; padding: 1rem; color: var(--text-muted); font-size: 0.8rem; }

      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: var(--bg-primary); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
